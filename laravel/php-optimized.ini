[PHP]
; Ottimizzazioni memoria per TechPlanner Filament
memory_limit = 256M
max_execution_time = 60

; Disabilita funzioni non necessarie per ridurre memoria
disable_functions = exec,shell_exec,system,passthru

; Ottimizzazioni OPcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.revalidate_freq=2
opcache.fast_shutdown=1

; Reduce realpath cache per risparmiare memoria
realpath_cache_size = 2M
realpath_cache_ttl = 300

; Ottimizzazioni varie
post_max_size = 16M
upload_max_filesize = 16M
max_input_vars = 3000

; Logging errors senza consumare troppa memoria
log_errors = On
error_log = /var/log/php_errors.log
display_errors = Off